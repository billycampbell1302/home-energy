<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/style.css">
<title>Home Energy – log in</title>
</head>
<body>
<header><h1>Home Energy</h1></header>
<main>
  <div class="card">
    <h2>Log in</h2>
    <form id="f">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button class="primary" style="width:100%;margin-top:6px">Log in</button>
      <p id="msg" class="err"></p>
    </form>
  </div>
</main>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('pw').value})});
  if (r.ok) location.href = '/'; else document.getElementById('msg').textContent = 'Wrong password';
};
</script>
</body>
</html>
